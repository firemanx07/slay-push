# Dev-only overlay: builds the app image from local source instead of
# pulling the published one (the base file's default), and adds Seq for
# structured-log viewing. Never required in production — see the plan's
# rationale in the Docker Compose section: prod logging is stdout JSON
# only, so any self-hoster can pipe it into whatever log stack they
# already run.
#
# Usage: docker compose -f docker-compose.yml -f docker-compose.dev.yml up
x-app-build: &app-build
  build:
    context: ../..
    dockerfile: deploy/docker/Dockerfile
  # These services also inherit image: from the base file's x-app-image
  # anchor. Without pull_policy: build, Compose can reuse that cached/pulled
  # image instead of rebuilding from the local source above.
  pull_policy: build

services:
  seq:
    image: datalust/seq:latest
    environment:
      ACCEPT_EULA: "Y"
    ports:
      - "8081:80" # Seq UI
      - "5341:5341" # CLEF ingestion
    volumes:
      - seqdata:/data

  migrate:
    <<: *app-build

  app:
    <<: *app-build
    environment:
      LOG_FORMAT: seq
      SEQ_URL: http://seq:5341
    depends_on:
      seq:
        condition: service_started

  worker:
    <<: *app-build
    environment:
      LOG_FORMAT: seq
      SEQ_URL: http://seq:5341
    depends_on:
      seq:
        condition: service_started

volumes:
  seqdata:
