x-app-image: &app-image
  build:
    context: ../..
    dockerfile: deploy/docker/Dockerfile
  environment:
    DATABASE_URL: postgres://pushdispatch:${POSTGRES_PASSWORD:-pushdispatch}@postgres:5432/pushdispatch?sslmode=disable
    REDIS_URL: redis://redis:6379/0
    APP_HTTP_ADDR: :8080
    # Required starting Phase 3 (secrets at rest for provider credentials);
    # unused by the app before that. Generate with:
    #   openssl rand -base64 32
    APP_MASTER_KEY: ${APP_MASTER_KEY:-}
    LOG_LEVEL: ${LOG_LEVEL:-info}
    LOG_FORMAT: ${LOG_FORMAT:-json}
    APP_COOKIE_SECURE: ${APP_COOKIE_SECURE:-true}
  depends_on:
    migrate:
      condition: service_completed_successfully

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pushdispatch
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pushdispatch}
      POSTGRES_DB: pushdispatch
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pushdispatch -d pushdispatch"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    <<: *app-image
    command: ["migrate"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  app:
    <<: *app-image
    command: ["serve-all"]
    ports:
      - "${APP_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "/server", "healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  worker:
    <<: *app-image
    command: ["worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

volumes:
  pgdata:
