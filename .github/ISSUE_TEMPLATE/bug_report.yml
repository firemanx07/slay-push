name: Bug report
description: Something isn't working the way it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Before filing, please check this isn't a security vulnerability — if it is, see
        [SECURITY.md](../../SECURITY.md) instead of opening a public issue.

  - type: input
    id: version
    attributes:
      label: Version / commit
      description: Docker image tag, or the commit SHA if running from source.
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - API (device registration / notifications)
        - Worker (fanout / send)
        - Provider adapter (Expo/FCM/APNs/HMS)
        - Auth / API keys
        - Dashboard
        - Docker / deployment
        - Other
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Redact any provider credentials, API keys, or tokens before pasting.
      render: shell
