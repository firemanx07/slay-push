baseURL: "https://firemanx07.github.io/slay-push/"
title: slay-push

enableGitInfo: true

module:
  imports:
    - path: github.com/imfing/hextra
  mounts:
    - source: content
      target: content
    - source: static
      target: static
    - source: ../api
      target: static/openapi
    - source: assets
      target: assets
    - source: layouts
      target: layouts
    - source: i18n
      target: i18n
    - source: data
      target: data
    - source: archetypes
      target: archetypes

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: false

menu:
  main:
    - name: Docs
      pageRef: /docs
      weight: 1
    - name: About
      pageRef: /about
      weight: 2
    - name: GitHub
      weight: 3
      url: "https://github.com/firemanx07/slay-push"
      params:
        icon: github
    - name: Search
      weight: 4
      params:
        type: search

params:
  description: Self-hostable, multi-tenant push notification dispatch for Expo, FCM, APNs, and Huawei HMS.
  navbar:
    displayTitle: true
    displayLogo: false
  footer:
    displayCopyright: false
    displayPoweredBy: true
  editURL:
    enable: true
    base: "https://github.com/firemanx07/slay-push/edit/main/docs/content"
