version: "2"
sql:
  - engine: "postgresql"
    queries: "internal/store/postgres/queries"
    schema: "migrations"
    gen:
      go:
        package: "postgres"
        out: "internal/store/postgres"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_pointers_for_null_types: true
